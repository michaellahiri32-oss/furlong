<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Furlong</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --surface2:#f2f1ec; --ink:#0b0b0b;
  --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --border:rgba(11,11,11,.10);
  --blue:#256abf; --blue-bar:#2a78d6; --chip:#eef0ee; --good:#0ca30c;
  --good-ink:#006300; --warn:#fab219; color-scheme:light;
  --brand-green:#7ed01e; --brand-blue:#1f9cf0;
  --brand-grad:linear-gradient(90deg,#7ed01e,#1f9cf0);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --page:#0d0d0d; --surface:#1a1a19; --surface2:#232320; --ink:#fff;
  --ink2:#c3c2b7; --muted:#8f8e86; --grid:#2c2c2a; --border:rgba(255,255,255,.12);
  --blue:#3987e5; --blue-bar:#3987e5; --chip:#26261f; --good:#0ca30c;
  --good-ink:#28c028; color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;
  line-height:1.4;overscroll-behavior-y:none}
a{color:inherit;text-decoration:none}
.app{max-width:640px;margin:0 auto;min-height:100vh}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--page);
  padding:calc(var(--safe-t) + 12px) 12px 10px;border-bottom:1px solid var(--grid)}
.top .row{display:flex;align-items:center;gap:8px;min-height:34px}
.iconbtn{border:none;background:none;color:var(--ink);font-size:22px;line-height:1;
  padding:6px 10px;cursor:pointer;border-radius:10px;flex:none}
.iconbtn:active{background:var(--surface2)}
.back{color:var(--blue);font-size:16px;font-weight:600;display:none}
.back.show{display:inline-flex;align-items:center;gap:3px}
.htext{flex:1;min-width:0}
.ttl{font-size:19px;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
/* burger drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;right:0;z-index:50;height:100%;width:76%;max-width:320px;
  background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .2s ease;
  padding:calc(var(--safe-t) + 10px) 0 0;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.menu.open{transform:translateX(0)}
.menu .mh{display:flex;align-items:center;gap:10px;padding:8px 18px 14px;
  border-bottom:1px solid var(--grid)}
.menu .mh img{width:34px;height:34px;border-radius:9px}
.menu .mh b{font-size:17px}
.menu a{display:flex;align-items:center;gap:12px;padding:15px 18px;font-size:16px;
  font-weight:560;border-bottom:1px solid var(--grid)}
.menu a .mi{font-size:19px;width:24px;text-align:center;color:var(--muted)}
.menu a.on{color:var(--blue)} .menu a.on .mi{color:var(--blue)}
.menu a:active{background:var(--surface2)}
/* content */
.wrap{padding:14px 16px calc(28px + var(--safe-b))}
/* landing */
.hero{text-align:center;padding:34px 16px 20px}
.hero img{width:150px;height:150px;border-radius:32px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.hero h1{font-size:26px;margin:18px 0 2px;letter-spacing:.5px}
.hero p{color:var(--muted);font-size:14px;margin:0}
.daybtns{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.daybtn{display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;padding:18px 18px;cursor:pointer}
.daybtn:active{background:var(--surface2)}
.daybtn .lab{flex:1}
.daybtn .lab b{font-size:19px;display:block}
.daybtn .lab span{font-size:13px;color:var(--muted)}
.daybtn .vb{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink);
  font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.daybtn .chev{color:var(--muted);font-size:22px}
.pick{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.pick:active{background:var(--surface2)}
.ptag{font-size:11px;font-weight:800;letter-spacing:.03em;color:#fff;padding:5px 9px;border-radius:8px;flex:none}
.ptag.nap{background:var(--brand-grad)}
.ptag.ewnap{background:var(--brand-blue)}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo span{font-size:12.5px;color:var(--muted)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:10px 8px;text-align:center}
.tile .n{font-size:20px;font-weight:680;font-variant-numeric:tabular-nums}
.tile .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:1px}
.tile.hl .n{color:var(--good-ink)}
/* value link + list cards */
.vlink{display:flex;align-items:center;gap:12px;border-radius:14px;padding:14px 15px;
  margin-bottom:14px;cursor:pointer;color:var(--good-ink);font-weight:640;
  background:color-mix(in srgb,var(--good) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.vlink .chev{margin-left:auto;font-size:20px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:10px;
  cursor:pointer;transition:background .12s}
.card:active{background:var(--surface2)}
.card .main{flex:1;min-width:0}
.card .h{font-size:17px;font-weight:640;display:flex;align-items:center;gap:8px}
.card .m{font-size:13px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);font-size:20px;flex:none}
.time{font-variant-numeric:tabular-nums;font-weight:680;font-size:15px;min-width:46px}
.vbadge{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink);
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.sectlabel{font-size:12px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin:16px 2px 8px}
/* race runners */
.rhead{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:12px 15px;margin-bottom:12px}
.rhead .t{font-weight:660;font-size:16px}.rhead .d{color:var(--muted);font-size:13px;margin-top:3px}
.runner{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:11px 13px;margin-bottom:8px}
.runner.top{border-color:color-mix(in srgb,var(--blue) 45%,var(--border))}
.runner .r1{display:flex;align-items:baseline;gap:9px}
.rank{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:680;font-size:14px;min-width:16px}
.hname{font-weight:650;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin:5px 0 4px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink2);font-weight:640}
.conn{font-size:12px;color:var(--muted);margin:0 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:20px;background:var(--chip);border-radius:5px;overflow:hidden}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--brand-grad);border-radius:5px}
.bar>b{position:absolute;right:8px;top:0;line-height:20px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
/* predicted top-3 podium */
.top3{margin:0 0 6px}
.t3h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2px 2px 9px;display:flex;align-items:center;gap:8px}
.t3h::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--brand-grad);opacity:.5}
.pod{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pod1{box-shadow:0 0 0 2px color-mix(in srgb,var(--brand-blue) 55%,transparent);border-color:transparent}
.medal{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.medal.m1{background:var(--brand-grad)}
.medal.m2{background:#9aa0a6}
.medal.m3{background:#c0824f}
.podhorse{font-weight:660;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podbar{height:8px;background:var(--chip);border-radius:4px;margin-top:7px;overflow:hidden}
.podbar>span{display:block;height:100%;background:var(--brand-grad);border-radius:4px}
.podpct{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--ink)}
.pricerow{display:flex;gap:16px;margin-top:8px;font-size:13.5px;font-variant-numeric:tabular-nums}
.pricerow .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.02em}
.pricerow .v{font-weight:640}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:20px;margin-left:auto}
.pill.win{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink)}
.pill.ew{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink2)}
.pill.ewshot{background:color-mix(in srgb,var(--brand-blue) 20%,transparent);color:var(--ink)}
.ewcard{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 15px;margin:0 0 14px;
  background:color-mix(in srgb,var(--brand-blue) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--brand-blue) 42%,transparent)}
.ewcard .ewic{font-size:20px;background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.ewcard .ewm{min-width:0}
.ewcard .ewm b{font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ewcard .ewm span{font-size:12.5px;color:var(--ink2)}
.vlink.ew{background:color-mix(in srgb,var(--brand-blue) 12%,transparent);
  border-color:color-mix(in srgb,var(--brand-blue) 42%,transparent);color:var(--ink)}
.vlink.builder{background:var(--surface);border-color:var(--border);color:var(--ink)}
/* bet builder */
.bchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.bchips::-webkit-scrollbar{display:none}
.bchip{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
  border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.bchip.on{background:var(--brand-grad);color:#fff;border-color:transparent}
.brow{display:flex;align-items:center;gap:12px;margin:8px 0 4px;flex-wrap:wrap}
.btog{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:20px;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btog.on{background:color-mix(in srgb,var(--brand-blue) 20%,transparent);color:var(--ink);
  border-color:color-mix(in srgb,var(--brand-blue) 42%,transparent)}
.bstake{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.bstake input{width:64px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--ink);font-size:14px}
.coupon{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.coupon .cn{width:26px;height:26px;border-radius:50%;background:var(--chip);display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.coupon .ci{flex:1;min-width:0}
.coupon .ci b{font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coupon .ci span{font-size:12px;color:var(--muted)}
.coupon .co{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.bsum{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 15px;margin:14px 0}
.bsum .row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid var(--grid)}
.bsum .row:last-child{border-bottom:none}
.bsum .row .k{color:var(--muted)}
.bsum .row .v{font-weight:640;font-variant-numeric:tabular-nums}
.bsum .big .k{color:var(--ink)}
.bsum .big .v{color:var(--good-ink);font-size:17px}
/* tracker */
.sub2{font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
.tchart{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;padding:8px 6px}
.pnl{font-size:30px;font-weight:760;font-variant-numeric:tabular-nums;margin:8px 2px 4px}
.pnl.pos{color:var(--good-ink)} .pnl.neg{color:#d64545}
.pnl span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.srow:active{background:var(--surface2)}
.sname{font-size:15px;font-weight:620;min-width:0}
.sname span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.sval{font-weight:740;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.sval span{display:block;font-size:12px;font-weight:600}
.sval.pos{color:var(--good-ink)} .sval.neg{color:#d64545}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14.5px}
.note{font-size:11.5px;color:var(--muted);margin-top:22px;padding-top:12px;border-top:1px solid var(--grid)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="row">
    <button class="iconbtn back" id="back">‹ Back</button>
    <div class="htext"><div class="ttl" id="title">Furlong</div><div class="sub" id="subtitle"></div></div>
    <button class="iconbtn" id="burger" aria-label="Menu">☰</button>
  </div></div>
  <div class="wrap" id="view"></div>
</div>
<div class="scrim" id="scrim"></div>
<nav class="menu" id="menu">
  <div class="mh"><img src="icon-192.png" alt=""><b>Furlong</b></div>
  <a href="#/" data-r=""><span class="mi">⌂</span>Home</a>
  <a href="#/tracker" data-r="tracker"><span class="mi">📊</span>Tracker</a>
  <a href="#/today" data-r="today"><span class="mi">🏇</span>Today’s racing</a>
  <a href="#/tomorrow" data-r="tomorrow"><span class="mi">📅</span>Tomorrow’s racing</a>
  <a href="#/today/ew" data-r="today/ew"><span class="mi">◆</span>Each-way shots — today</a>
  <a href="#/tomorrow/ew" data-r="tomorrow/ew"><span class="mi">◇</span>Each-way shots — tomorrow</a>
  <a href="#/today/builder" data-r="today/builder"><span class="mi">🎫</span>Bet builder — today</a>
  <a href="#/tomorrow/builder" data-r="tomorrow/builder"><span class="mi">🎫</span>Bet builder — tomorrow</a>
</nav>
<script>
const S = { days:{today:null, tomorrow:null}, loaded:false, tracker:null, trackerStrat:'value',
  builder:{type:'lucky15', strat:'balanced', ew:false, stake:1, day:'today'} };
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pct = p => (p*100).toFixed(p>=0.1?0:1)+'%';
const plural = (n,w)=>`${n} ${w}${n===1?'':'s'}`;
const DAY_NAME = {today:'Today', tomorrow:'Tomorrow'};

async function fetchJSON(f){
  try{ const r=await fetch(f,{cache:'no-store'}); if(r.ok) return await r.json(); }catch(e){}
  try{ const c=await fetch(f); return await c.json(); }catch(e){ return null; }
}
async function load(){
  const [t,m,tr] = await Promise.all([fetchJSON('data.json'), fetchJSON('data-tomorrow.json'), fetchJSON('tracker.json')]);
  S.days.today=t; S.days.tomorrow=m; S.tracker=tr; S.loaded=true; route();
}

/* burger */
function openMenu(o){ $('menu').classList.toggle('open',o); $('scrim').classList.toggle('open',o); }
$('burger').addEventListener('click',()=>openMenu(!$('menu').classList.contains('open')));
$('scrim').addEventListener('click',()=>openMenu(false));
$('menu').addEventListener('click',e=>{ if(e.target.closest('a')) openMenu(false); });

function setHead(title, sub, showBack){
  $('title').textContent=title; $('subtitle').textContent=sub||'';
  $('back').classList.toggle('show',!!showBack);
  const cur=(location.hash||'#/').slice(2);
  $('menu').querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.getAttribute('data-r')===cur));
}
function pillFor(o){
  if(o.value_win) return `<span class="pill win">▲ VALUE ${o.ev_win>0?'+':''}${Math.round(o.ev_win*100)}%</span>`;
  if(o.value_ew) return `<span class="pill ew">EW +${Math.round((o.ev_ew||0)*100)}%</span>`;
  if(o.ew_shot) return `<span class="pill ewshot">◆ E/W shot</span>`;
  return '';
}
function pickCard(tag, p, stat){
  const link = (p.mi!=null&&p.ri!=null)?`location.hash='#/today/m/${p.mi}/r/${p.ri}'`:'';
  return `<div class="pick" onclick="${link}">
    <span class="ptag ${tag==='NAP'?'nap':'ewnap'}">${tag}</span>
    <div class="pinfo"><b>${esc(p.horse)}</b>
      <span>${esc(p.course)}${p.off?' · '+esc(p.off):''} · ${esc(p.fair)} · ${stat}</span></div>
    <span class="chev">›</span></div>`;
}

/* ---- views ---- */
function viewLanding(){
  setHead('Furlong','', false);
  const sum = k => {
    const d=S.days[k];
    if(!S.loaded) return 'Loading…';
    if(!d||!d.meetings||!d.meetings.length) return k==='tomorrow'?'Not published yet':'No racing loaded';
    return `${d.day_label} · ${plural(d.totals.meetings,'course')}`;
  };
  const vb = k => { const d=S.days[k]; return (d&&d.totals&&d.totals.value)?`<span class="vb">${d.totals.value} value</span>`:''; };
  let h = `<div class="hero"><img src="icon-512.png" alt="Furlong"><h1>FURLONG</h1>
      <p>Win &amp; Place predictions</p></div>
    <div class="daybtns">
      <div class="daybtn" onclick="location.hash='#/today'">
        <div class="lab"><b>Today</b><span>${esc(sum('today'))}</span></div>${vb('today')}<span class="chev">›</span></div>
      <div class="daybtn" onclick="location.hash='#/tomorrow'">
        <div class="lab"><b>Tomorrow</b><span>${esc(sum('tomorrow'))}</span></div>${vb('tomorrow')}<span class="chev">›</span></div>
    </div>`;
  const hp = (S.days.today && S.days.today.headline) || null;
  if(hp && (hp.nap || hp.ew_nap)){
    h += `<div class="sectlabel" style="margin-top:24px">Today’s headline picks</div>`;
    if(hp.nap) h += pickCard('NAP', hp.nap, `${pct(hp.nap.p_win)} win chance`);
    if(hp.ew_nap) h += pickCard('E/W NAP', hp.ew_nap, hp.ew_nap.p_place!=null?`${pct(hp.ew_nap.p_place)} to place`:'each-way');
  }
  const tk=S.tracker;
  const tkSub = (tk&&tk.days) ? `${money(tk.strategies.value?tk.strategies.value.profit:0)} on value · ${tk.days} day${tk.days===1?'':'s'}` : 'how the picks are performing';
  h += `<div class="vlink" style="margin-top:18px" onclick="location.hash='#/tracker'">
      📊 Tracker — ${esc(tkSub)}<span class="chev">›</span></div>`;
  return h;
}

function viewDay(day){
  const d=S.days[day];
  setHead(`${DAY_NAME[day]}’s Racing`, d?d.day_label:'', true);
  if(!S.loaded) return `<div class="empty">Loading…</div>`;
  if(!d||!d.meetings||!d.meetings.length)
    return `<div class="empty">${day==='tomorrow'
      ? 'Tomorrow’s card isn’t published yet — declarations usually land the evening before. Check back later.'
      : 'No racing loaded yet.'}</div>`;
  const t=d.totals;
  let h='';
  if(t.ew) h+=`<div class="vlink ew" onclick="location.hash='#/${day}/ew'">
      ◆ Each-way shots — ${plural(t.ew,'race')}<span class="chev">›</span></div>`;
  if(t.value) h+=`<div class="vlink" onclick="location.hash='#/${day}/value'">
      ▲ Value shortlist — ${plural(t.value,'selection')}<span class="chev">›</span></div>`;
  h+=`<div class="vlink builder" onclick="location.hash='#/${day}/builder'">
      🎫 Bet builder — Lucky 15, Yankee, Heinz…<span class="chev">›</span></div>`;
  h+=`<div class="tiles">
    <div class="tile"><div class="n">${t.meetings}</div><div class="l">Courses</div></div>
    <div class="tile"><div class="n">${t.races}</div><div class="l">Races</div></div>
    <div class="tile"><div class="n">${t.runners}</div><div class="l">Runners</div></div>
    <div class="tile hl"><div class="n">${t.value||t.ew||0}</div><div class="l">${t.value?'Value':'E/W'}</div></div></div>`;
  h+=`<div class="sectlabel">Meetings</div>`;
  d.meetings.forEach((m,i)=>{
    h+=`<a class="card" href="#/${day}/m/${i}">
      <div class="main"><div class="h">${esc(m.course)}
        ${m.n_value?`<span class="vbadge">${m.n_value} value</span>`:''}</div>
        ${m.going?`<div class="m">${esc(m.going)}</div>`:''}</div>
      <span class="chev">›</span></a>`;
  });
  h+=`<div class="note">Updated ${esc(d.generated_label||'')}. 18+ · begambleaware.org.</div>`;
  return h;
}

  const d=S.days[day]; const m=d&&d.meetings[mi];
  if(!m) return viewDay(day);

}

function viewRace(day,mi,ri){
  const d=S.days[day]; const m=d&&d.meetings[mi]; const r=m&&m.races[ri];
  if(!r) return viewDay(day);
  setHead(m.course, `${esc(r.off||'')} · ${esc(r.title)}`, true);
  const pmax=Math.max(...r.runners.map(x=>x.p_win),0.01);
  let h=`<div class="rhead"><div class="t">${esc(r.off||'')} ${esc(r.title)}</div>
    <div class="d">${esc(r.distance)} · ${esc(r.going)} · ${r.ran} runners</div></div>`;
  // graphic predicted top 3
  const t3 = r.runners.slice(0,3).map(o=>{
    const pw = Math.max(8, o.p_win/pmax*100);
    return `<div class="pod pod${o.rank}">
      <div class="medal m${o.rank}">${o.rank}</div>
      <div style="min-width:0"><div class="podhorse">${esc(o.horse)}</div>
        <div class="podbar"><span style="width:${pw}%"></span></div></div>
      <div class="podpct">${pct(o.p_win)}</div></div>`;
  }).join('');
  h += `<div class="top3"><div class="t3h">Predicted top 3</div>${t3}</div>`;
  const ewr = r.runners.find(o=>o.ew_shot);
  if(ewr){
    h += `<div class="ewcard"><span class="ewic">◆</span>
      <div class="ewm"><b>Each-way shot — ${esc(ewr.horse)}</b>
      <span>${esc(ewr.fair)} · ${pct(ewr.p_place)} chance of a top-${ewr.ew_places||3} finish</span></div></div>`;
  }
  h += `<div class="sectlabel">Full field</div>`;
  const HG={b:'blinkers',v:'visor',h:'hood',t:'tongue tie',p:'cheekpieces',e:'eye shield'};
  r.runners.forEach(o=>{
    const w=Math.max(6,o.p_win/pmax*100); const meta=[];
    if(o.form) meta.push(`Form <b>${esc(o.form)}</b>`);
    if(o.draw!=null) meta.push(`Draw ${o.draw}`);
    if(o.age!=null) meta.push(`${o.age}yo`);
    if(o.weight_lbs!=null) meta.push(`${o.weight_lbs}lb`);
    if(o.or!=null) meta.push(`OR ${o.or}`);
    if(o.rpr!=null) meta.push(`RPR ${o.rpr}`);
    if(o.headgear) meta.push(esc(HG[o.headgear.toLowerCase()]||o.headgear));
    const conn=[o.jockey,o.trainer].filter(Boolean).map(esc).join(' · ');
    h+=`<div class="runner ${o.rank===1?'top':''}">
      <div class="r1"><span class="rank">${o.number!=null?o.number:o.rank}</span>
        <span class="hname">${esc(o.horse)}</span>${pillFor(o)}</div>
      <div class="meta">${meta.join(' · ')}</div>
      ${conn?`<div class="conn">${conn}</div>`:''}
      <div class="bar"><span style="width:${w}%"></span><b>${pct(o.p_win)}</b></div>
      <div class="pricerow">
        <div><div class="k">Fair</div><div class="v">${esc(o.fair)}</div></div>
        <div><div class="k">Price</div><div class="v">${o.sp?esc(o.sp):'—'}</div></div>
        <div><div class="k">Place</div><div class="v">${o.p_place!=null?pct(o.p_place):'—'}</div></div>
      </div></div>`;
  });
  return h;
}

/* ---- bet builder ---- */
const BETS={
  trixie:{label:'Trixie',n:3,sizes:[2,3],bets:4},
  patent:{label:'Patent',n:3,sizes:[1,2,3],bets:7},
  yankee:{label:'Yankee',n:4,sizes:[2,3,4],bets:11},
  lucky15:{label:'Lucky 15',n:4,sizes:[1,2,3,4],bets:15},
  canadian:{label:'Canadian',n:5,sizes:[2,3,4,5],bets:26},
  lucky31:{label:'Lucky 31',n:5,sizes:[1,2,3,4,5],bets:31},
  heinz:{label:'Heinz',n:6,sizes:[2,3,4,5,6],bets:57},
  lucky63:{label:'Lucky 63',n:6,sizes:[1,2,3,4,5,6],bets:63},
  superheinz:{label:'Super Heinz',n:7,sizes:[2,3,4,5,6,7],bets:120},
  goliath:{label:'Goliath',n:8,sizes:[2,3,4,5,6,7,8],bets:247},
};

function builderCandidates(day, strat){
  const d=S.days[day]; const cands=[];
  if(!d||!d.meetings) return cands;
  d.meetings.forEach((m,mi)=>m.races.forEach((r,ri)=>{
    if(!r.runners||!r.runners.length) return;
    let pick=null, score=-1;
    if(strat==='value'){
      r.runners.forEach(o=>{
        if(o.rank>=2 && o.fair_dec>=4 && o.fair_dec<=34 && (o.p_place||0)>=0.20){
          const s=(o.p_place||0)*o.fair_dec; if(s>score){score=s;pick=o;}
        }
      });
    } else if(strat==='bankers'){
      pick=r.runners[0]; score=pick.p_win;
    } else { // balanced
      pick=r.runners[0]; score=pick.p_win*Math.pow(pick.fair_dec||1,0.35);
    }
    if(pick) cands.push(Object.assign({},pick,{course:m.course,off:r.off,mi,ri,score}));
  }));
  cands.sort((a,b)=>b.score-a.score);
  return cands;
}

function poissonBinom(ps){ let d=[1];
  ps.forEach(p=>{ const nd=new Array(d.length+1).fill(0);
    for(let i=0;i<d.length;i++){ nd[i]+=d[i]*(1-p); nd[i+1]+=d[i]*p; } d=nd; }); return d; }
function esp(odds){ let e=[1];
  odds.forEach(o=>{ const ne=new Array(e.length+1).fill(0);
    for(let i=0;i<e.length;i++){ ne[i]+=e[i]; ne[i+1]+=e[i]*o; } e=ne; }); return e; }

function renderBuilder(){ $('view').innerHTML=viewBuilder(S.builder.day); }
function setBType(t){ S.builder.type=t; renderBuilder(); }
function setBStrat(s){ S.builder.strat=s; renderBuilder(); }
function toggleBEW(){ S.builder.ew=!S.builder.ew; renderBuilder(); }
function setBStake(v){ const n=parseFloat(v); S.builder.stake=(isFinite(n)&&n>0)?n:1; renderBuilder(); }

function viewBuilder(day){
  S.builder.day=day; const b=S.builder; const cfg=BETS[b.type];
  const d=S.days[day];
  setHead('Bet builder', d?d.day_label:'', true);
  if(!d||!d.meetings||!d.meetings.length)
    return `<div class="empty">${day==='tomorrow'?'Tomorrow’s card isn’t published yet.':'No racing loaded yet.'}</div>`;

  const types=Object.keys(BETS).map(k=>`<div class="bchip ${b.type===k?'on':''}" onclick="setBType('${k}')">${BETS[k].label}</div>`).join('');
  const strats=[['bankers','Bankers'],['balanced','Balanced'],['value','Value']]
    .map(([k,l])=>`<div class="bchip ${b.strat===k?'on':''}" onclick="setBStrat('${k}')">${l}</div>`).join('');
  let h=`<div class="sectlabel" style="margin-top:2px">Bet type</div><div class="bchips">${types}</div>
    <div class="sectlabel">Strategy</div><div class="bchips">${strats}</div>
    <div class="brow">
      <div class="btog ${b.ew?'on':''}" onclick="toggleBEW()">${b.ew?'✓ ':''}Each-way</div>
      <div class="bstake">Unit stake £<input type="number" min="0.1" step="0.5" value="${b.stake}"
        onchange="setBStake(this.value)"></div>
    </div>`;

  const cands=builderCandidates(day,b.strat);
  if(cands.length<cfg.n){
    h+=`<div class="empty">Only ${cands.length} suitable races right now — a ${cfg.label} needs ${cfg.n}. Try a smaller bet or the Balanced/Bankers strategy.</div>`;
    return h;
  }
  const sels=cands.slice(0,cfg.n);
  h+=`<div class="sectlabel">Your ${cfg.n} selections${b.strat==='value'?' (value angle)':''}</div>`;
  sels.forEach((o,i)=>{
    const line=b.ew&&o.p_place!=null?`${pct(o.p_win)} win · ${pct(o.p_place)} place`:`${pct(o.p_win)} win`;
    h+=`<div class="coupon" onclick="location.hash='#/${day}/m/${o.mi}/r/${o.ri}'">
      <span class="cn">${i+1}</span>
      <div class="ci"><b>${esc(o.horse)}</b><span>${esc(o.course)}${o.off?' · '+esc(o.off):''} · ${line}</span></div>
      <span class="co">${esc(o.sp||o.fair)}</span></div>`;
  });

  const pw=sels.map(o=>o.p_win);
  const dist=poissonBinom(pw);
  const minS=cfg.sizes[0];
  const pRet=dist.slice(minS).reduce((a,x)=>a+x,0);
  const pAll=dist[cfg.n];
  const expWin=pw.reduce((a,x)=>a+x,0);
  let ml=0; dist.forEach((x,i)=>{ if(x>dist[ml]) ml=i; });
  const usingOdds=sels.some(o=>o.sp_dec!=null);
  const e=esp(sels.map(o=>o.sp_dec||o.fair_dec||1));
  const allWin=cfg.sizes.reduce((a,s)=>a+(e[s]||0),0);
  const nBets=cfg.bets*(b.ew?2:1);
  const total=nBets*b.stake;

  h+=`<div class="bsum">
    <div class="row"><span class="k">${cfg.label}${b.ew?' (e/w)':''}</span><span class="v">${nBets} bets</span></div>
    <div class="row"><span class="k">Total stake</span><span class="v">£${total.toFixed(2)}</span></div>
    <div class="row big"><span class="k">Chance of a return</span><span class="v">${(pRet*100).toFixed(0)}%</span></div>
    <div class="row"><span class="k">Chance all ${cfg.n} win</span><span class="v">${(pAll*100).toFixed(pAll<0.1?1:0)}%</span></div>
    <div class="row"><span class="k">Most likely winners</span><span class="v">${ml} of ${cfg.n}</span></div>
    <div class="row"><span class="k">Expected winners</span><span class="v">${expWin.toFixed(1)}</span></div>
    ${b.ew?`<div class="row"><span class="k">Expected places</span><span class="v">${sels.map(o=>o.p_place||0).reduce((a,x)=>a+x,0).toFixed(1)} of ${cfg.n}</span></div>`:''}
    <div class="row"><span class="k">If all win (${usingOdds?'at odds':'at fair odds'})</span><span class="v">£${(allWin*b.stake).toFixed(2)}</span></div>
  </div>
  <div class="note">Selections are one per race, ranked by the chosen strategy. Probabilities are the model’s${usingOdds?'; returns use the best available bookmaker odds (final return depends on the price you actually take)':'; returns are illustrative at our fair odds until live prices are available'}. Not advice. 18+ · begambleaware.org.</div>`;
  return h;
}

/* ---- tracker ---- */
const TSTRATS=['value','nap','ewnap','ew_shots','lucky63_bankers','lucky63_value'];
function money(v){ return (v>=0?'+£':'−£')+Math.abs(v).toFixed(2); }
function setTStrat(k){ S.trackerStrat=k; $('view').innerHTML=viewTracker(); }
function trackerChart(strat){
  const pts=(S.tracker.cumulative||[]).map(p=>({d:p.date,v:p[strat]||0}));
  if(!pts.length) return '';
  const W=320,H=120,pad=10;
  const xs=i=>pad+(pts.length<=1?0:(i/(pts.length-1))*(W-2*pad));
  const vals=pts.map(p=>p.v); let mn=Math.min(0,...vals),mx=Math.max(0,...vals);
  if(mn===mx){mn-=1;mx+=1;}
  const ys=v=>pad+(1-(v-mn)/(mx-mn))*(H-2*pad);
  const z=ys(0), last=pts[pts.length-1].v, col=last>=0?'var(--good-ink)':'#d64545';
  const line=pts.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' ');
  const area=`M${xs(0).toFixed(1)},${z.toFixed(1)} `+pts.map((p,i)=>`L${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' ')+` L${xs(pts.length-1).toFixed(1)},${z.toFixed(1)} Z`;
  const dot=pts.length===1?`<circle cx="${xs(0).toFixed(1)}" cy="${ys(pts[0].v).toFixed(1)}" r="3.5" fill="${col}"/>`:'';
  return `<svg class="tchart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${z.toFixed(1)}" x2="${W-pad}" y2="${z.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
    <path d="${area}" fill="${col}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dot}</svg>`;
}
function viewTracker(){
  setHead('Tracker','How the picks are performing', true);
  const tk=S.tracker;
  if(!tk || !tk.days) return `<div class="empty">The tracker starts building once a day's racing has been settled. Come back tomorrow and it'll begin filling in. 📊</div>`;
  let strat=(S.trackerStrat && tk.strategies[S.trackerStrat])?S.trackerStrat:'value';
  S.trackerStrat=strat;
  const avail=TSTRATS.filter(k=>tk.strategies[k]);
  const chips=avail.map(k=>`<div class="bchip ${k===strat?'on':''}" onclick="setTStrat('${k}')">${esc(tk.strategies[k].label)}</div>`).join('');
  const s=tk.strategies[strat];
  let h=`<div class="sub2">${tk.days} day${tk.days===1?'':'s'} settled${tk.since?' · since '+esc(tk.since):''}</div>`;
  h+=`<div class="bchips">${chips}</div>`;
  h+=trackerChart(strat);
  h+=`<div class="pnl ${s.profit>=0?'pos':'neg'}">${money(s.profit)}<span>profit · ${s.roi>=0?'+':''}${s.roi}% ROI · ${s.kind==='multiple'?'£1 unit':'£1 stakes'}</span></div>`;
  h+=`<div class="tiles">
    <div class="tile"><div class="n">${s.bets}</div><div class="l">Bets</div></div>
    ${s.kind!=='multiple'?`<div class="tile"><div class="n">${s.strike}%</div><div class="l">${s.kind==='ew'?'Won':'Strike'}</div></div>`:''}
    ${s.kind==='ew'?`<div class="tile"><div class="n">${s.places}</div><div class="l">Placed</div></div>`:''}
    <div class="tile"><div class="n">£${s.staked.toFixed(0)}</div><div class="l">Staked</div></div>
    <div class="tile"><div class="n">£${s.returned.toFixed(0)}</div><div class="l">Returned</div></div></div>`;
  h+=`<div class="sectlabel">All strategies</div>`;
  avail.forEach(k=>{ const x=tk.strategies[k];
    h+=`<div class="srow" onclick="setTStrat('${k}')">
      <div class="sname">${esc(x.label)}<span>${x.kind==='multiple'?x.bets+' bets · £'+x.staked.toFixed(0)+' staked':x.strike+'% strike · '+x.bets+' bets'}</span></div>
      <div class="sval ${x.profit>=0?'pos':'neg'}">${money(x.profit)}<span>${x.roi>=0?'+':''}${x.roi}%</span></div></div>`; });
  h+=`<div class="note">Flat £1 stakes, settled at the price Furlong showed (Lucky 63 = £1 unit, £63 a line). A short record isn't proof of anything — past results don't predict future ones. Not advice. 18+ · begambleaware.org.</div>`;
  return h;
}

function route(){
  const p=(location.hash||'#/').slice(2).split('/').filter(x=>x!=='');
  let html;
  if(p.length===0) html=viewLanding();
  else if(p[0]==='tracker') html=viewTracker();
  else if(p[0]==='today'||p[0]==='tomorrow'){
    const day=p[0];
    if(p[1]==='value') html=viewValue(day);
    else if(p[1]==='ew') html=viewEW(day);
    else if(p[1]==='builder') html=viewBuilder(day);
    else if(p[1]==='m'&&p[3]==='r') html=viewRace(day,+p[2],+p[4]);
    else if(p[1]==='m') html=viewMeeting(day,+p[2]);
    else html=viewDay(day);
  } else html=viewLanding();
  $('view').innerHTML=html; window.scrollTo(0,0);
}

$('back').addEventListener('click',()=>{ if(history.length>1) history.back(); else location.hash='#/'; });
window.addEventListener('hashchange',route);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
route(); load();
setInterval(load, 15*60*1000);
